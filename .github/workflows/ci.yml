name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve Antigravity CLI version
        id: agy-version
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          manifest="$(curl -fsSL https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json)"
          version="$(printf '%s' "$manifest" | jq -r '.version')"
          sha512="$(printf '%s' "$manifest" | jq -r '.sha512' | cut -c1-16)"
          if [ -z "$version" ] || [ "$version" = "null" ] || [ -z "$sha512" ] || [ "$sha512" = "null" ]; then
            echo "Failed to resolve Antigravity CLI version from manifest" >&2
            exit 1
          fi
          echo "version=${version}-${sha512}" >> "$GITHUB_OUTPUT"

      - name: Cache Antigravity CLI
        id: cache-agy
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/agy
          key: agy-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.agy-version.outputs.version }}

      - name: Install Antigravity CLI
        if: steps.cache-agy.outputs.cache-hit != 'true'
        run: curl -fsSL https://antigravity.google/cli/install.sh | bash

      - name: Verify Antigravity CLI version
        run: agy --version

      - name: Validate plugin with Antigravity CLI
        run: |
          AGY_HOME="$(mktemp -d)"
          trap 'rm -rf "$AGY_HOME"' EXIT
          HOME="$AGY_HOME" agy plugin validate --strict .
          HOME="$AGY_HOME" agy plugin install .
          HOME="$AGY_HOME" agy plugin validate --strict "$AGY_HOME/.gemini/config/plugins/agy-pstack-next"
          HOME="$AGY_HOME" agy plugin list --json > "$AGY_HOME/plugins.json"
          AGY_PLUGINS_JSON="$AGY_HOME/plugins.json" bun -e '
            import { readdirSync, readFileSync, existsSync, accessSync, constants } from "node:fs";
            import { join } from "node:path";

            const errors = [];
            const fail = (msg) => errors.push(msg);

            if (existsSync("plugin.json")) {
              fail("root plugin.json should not exist alongside .antigravity-plugin/plugin.json");
            }
            if (existsSync("agents")) {
              fail("legacy agents directory should not exist in Swarm-Centric Pstack v2");
            }
            if (existsSync("automations")) {
              fail("legacy automations directory should not exist in Swarm-Centric Pstack v2");
            }
            if (!existsSync("hooks.json")) {
              fail("root hooks.json is missing");
            }

            const checkExecutable = (relPath) => {
              try {
                accessSync(relPath, constants.X_OK);
              } catch {
                fail(`${relPath} is missing or not executable`);
              }
            };
            checkExecutable("hooks/guard.mjs");
            checkExecutable("skills/pstack/scripts/watch-pr");

            for (const capsule of ["coordinator", "poteto-agent", "research", "comment-sicko"]) {
              const p = join("roles", `${capsule}.md`);
              if (!existsSync(p)) fail(`Missing role capsule ${p}`);
            }

            for (const topo of ["program", "build", "diagnose", "hillclimb", "ship", "evolve"]) {
              const p = join("skills/pstack/topologies", `${topo}.md`);
              if (!existsSync(p)) fail(`Missing pstack topology ${p}`);
            }

            const pluginJson = JSON.parse(readFileSync(".antigravity-plugin/plugin.json", "utf8"));
            const allowedPluginKeys = new Set([
              "name",
              "displayName",
              "version",
              "description",
              "author",
              "homepage",
              "repository",
              "license",
              "keywords",
              "logo",
              "suggestedPrompts",
            ]);
            for (const key of Object.keys(pluginJson)) {
              if (!allowedPluginKeys.has(key)) {
                fail(`.antigravity-plugin/plugin.json contains unsupported key "${key}"`);
              }
            }
            if (!/^(?!.*(?:--|\.\.))[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$/.test(pluginJson.name ?? "")) {
              fail(`.antigravity-plugin/plugin.json has invalid name "${pluginJson.name}"`);
            }
            for (const field of ["name", "version", "description"]) {
              if (!pluginJson[field] || typeof pluginJson[field] !== "string") {
                fail(`.antigravity-plugin/plugin.json missing string field "${field}"`);
              }
            }
            if (!pluginJson.logo || !existsSync(pluginJson.logo)) {
              fail(`.antigravity-plugin/plugin.json logo "${pluginJson.logo}" does not exist`);
            }

            const parseFrontmatter = (filePath) => {
              const content = readFileSync(filePath, "utf8");
              const match = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
              if (!match) {
                fail(`${filePath}: missing YAML frontmatter`);
                return null;
              }
              return match[1];
            };

            const expectedSkills = readdirSync("skills", { withFileTypes: true })
              .filter((d) => d.isDirectory())
              .map((d) => d.name)
              .sort();

            if (expectedSkills.length !== 13) {
              fail(`Expected 13 skills, found ${expectedSkills.length}: ${expectedSkills.join(", ")}`);
            }

            for (const dir of expectedSkills) {
              const skillFile = join("skills", dir, "SKILL.md");
              if (!existsSync(skillFile)) {
                fail(`skills/${dir}: missing SKILL.md`);
                continue;
              }
              const fm = parseFrontmatter(skillFile);
              if (!fm) continue;
              const nameMatch = fm.match(/^name:\s*(.+)$/m);
              const descMatch = fm.match(/^description:\s*(.+)$/m);
              const skillName = nameMatch?.[1]?.trim();
              if (skillName !== dir) {
                fail(`${skillFile}: frontmatter name "${skillName}" does not match directory "${dir}"`);
              }
              if (!descMatch?.[1]?.trim()) {
                fail(`${skillFile}: missing description in frontmatter`);
              }
              for (const badKey of ["paths", "icon", "color"]) {
                if (new RegExp(`^${badKey}:`, "m").test(fm)) {
                  fail(`${skillFile}: unsupported top-level frontmatter key "${badKey}"`);
                }
              }
            }

            const installedList = JSON.parse(readFileSync(process.env.AGY_PLUGINS_JSON, "utf8"));
            const installed = installedList.find((p) => p.name === pluginJson.name);
            if (!installed) {
              fail(`agy plugin list --json did not include "${pluginJson.name}"`);
            } else {
              if (!installed.enabled) fail(`Installed plugin "${pluginJson.name}" is not enabled`);
              if (installed.version !== pluginJson.version) {
                fail(`Installed plugin version "${installed.version}" !== "${pluginJson.version}"`);
              }
              const loadedSkills = [...(installed.skills ?? [])].sort();
              const loadedAgents = [...(installed.agents ?? [])].sort();
              if (JSON.stringify(loadedSkills) !== JSON.stringify(expectedSkills)) {
                fail(`Loaded skills mismatch: expected ${expectedSkills.length}, got ${loadedSkills.length}`);
              }
              if (loadedAgents.length !== 0) {
                fail(`Expected 0 loaded agents, got ${loadedAgents.length}`);
              }
            }

            if (errors.length > 0) {
              for (const err of errors) console.error(`ERROR: ${err}`);
              process.exit(1);
            }
            console.log(`Validated ${expectedSkills.length} skills, 4 role capsules, 6 topologies, and hooks guard.`);
          '

      - name: Run swarm guard unit tests
        run: node --test hooks/guard.test.mjs

      - name: Smoke check watch-pr CLI
        run: ./skills/pstack/scripts/watch-pr --help > /dev/null

      - name: Test statechart
        working-directory: skills/statechart/scripts
        run: |
          bun install
          bun run test
