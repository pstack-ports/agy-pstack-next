name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Antigravity CLI version
        id: agy-version
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          manifest="$(curl -fsSL https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json)"
          version="$(printf '%s' "$manifest" | jq -r '.version')"
          sha512="$(printf '%s' "$manifest" | jq -r '.sha512' | cut -c1-16)"
          if [ -z "$version" ] || [ "$version" = "null" ] || [ -z "$sha512" ] || [ "$sha512" = "null" ]; then
            echo "Failed to resolve Antigravity CLI version from manifest" >&2
            exit 1
          fi
          echo "version=${version}-${sha512}" >> "$GITHUB_OUTPUT"

      - name: Cache Antigravity CLI
        id: cache-agy
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/agy
          key: agy-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.agy-version.outputs.version }}

      - name: Install Antigravity CLI
        if: steps.cache-agy.outputs.cache-hit != 'true'
        run: curl -fsSL https://antigravity.google/cli/install.sh | bash

      - name: Verify Antigravity CLI version
        run: agy --version

      - name: Validate clean-sheet plugin structure and links
        run: |
          AGY_HOME="$(mktemp -d)"
          trap 'rm -rf "$AGY_HOME"' EXIT
          HOME="$AGY_HOME" agy plugin validate --strict .
          HOME="$AGY_HOME" agy plugin install .
          HOME="$AGY_HOME" agy plugin validate --strict "$AGY_HOME/.gemini/config/plugins/agy-pstack-next"
          HOME="$AGY_HOME" agy plugin list --json > "$AGY_HOME/plugins.json"
          AGY_PLUGINS_JSON="$AGY_HOME/plugins.json" node -e '
            import { readdirSync, readFileSync, existsSync } from "node:fs";
            import { dirname, join, resolve } from "node:path";

            const errors = [];
            const fail = (msg) => errors.push(msg);

            for (const legacy of ["plugin.json", "hooks.json", "hooks", "roles", "agents", "automations", "docs"]) {
              if (existsSync(legacy)) {
                fail(`Legacy path "${legacy}" must not exist in clean-sheet pstack v3`);
              }
            }

            const pluginJson = JSON.parse(readFileSync(".antigravity-plugin/plugin.json", "utf8"));
            const expectedSkills = ["crucible", "interrogate", "pstack", "statechart", "understand", "verify-gen"];
            const actualSkills = readdirSync("skills", { withFileTypes: true })
              .filter((d) => d.isDirectory())
              .map((d) => d.name)
              .sort();

            if (JSON.stringify(actualSkills) !== JSON.stringify(expectedSkills)) {
              fail(`Expected skills [${expectedSkills.join(", ")}], found [${actualSkills.join(", ")}]`);
            }

            const walkMd = (dir) => {
              const out = [];
              for (const entry of readdirSync(dir, { withFileTypes: true })) {
                const p = join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name === "scripts") fail(`Unexpected scripts directory: ${p}`);
                  out.push(...walkMd(p));
                } else if (entry.name.endsWith(".md")) {
                  out.push(p);
                }
              }
              return out;
            };

            const mdFiles = ["README.md", ...walkMd("skills")];
            for (const file of mdFiles) {
              const text = readFileSync(file, "utf8");
              for (const m of text.matchAll(/\]\((?!https?:|mailto:|file:|customization:)([^)#]+)(?:#[^)]*)?\)/g)) {
                const target = resolve(dirname(file), m[1]);
                if (!existsSync(target)) {
                  fail(`${file}: broken relative link "${m[1]}"`);
                }
              }
            }

            for (const dir of actualSkills) {
              const skillFile = join("skills", dir, "SKILL.md");
              const content = readFileSync(skillFile, "utf8");
              const fm = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/)?.[1];
              if (!fm) {
                fail(`${skillFile}: missing YAML frontmatter`);
                continue;
              }
              const skillName = fm.match(/^name:\s*(.+)$/m)?.[1]?.trim();
              if (skillName !== dir) fail(`${skillFile}: name "${skillName}" !== "${dir}"`);
              if (!fm.match(/^description:\s*(.+)$/m)?.[1]?.trim()) {
                fail(`${skillFile}: missing description`);
              }
            }

            const installedList = JSON.parse(readFileSync(process.env.AGY_PLUGINS_JSON, "utf8"));
            const installed = installedList.find((p) => p.name === pluginJson.name);
            if (!installed || !installed.enabled) {
              fail(`Installed plugin "${pluginJson.name}" missing or disabled`);
            } else if (JSON.stringify([...(installed.skills ?? [])].sort()) !== JSON.stringify(expectedSkills)) {
              fail(`Loaded skills mismatch: ${JSON.stringify(installed.skills)}`);
            }

            if (errors.length > 0) {
              for (const err of errors) console.error(`ERROR: ${err}`);
              process.exit(1);
            }
            console.log(`Validated ${actualSkills.length} clean-sheet skills and ${mdFiles.length} markdown files.`);
          '
