name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve Antigravity CLI version
        id: agy-version
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          manifest="$(curl -fsSL https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json)"
          version="$(printf '%s' "$manifest" | jq -r '.version')"
          sha512="$(printf '%s' "$manifest" | jq -r '.sha512' | cut -c1-16)"
          if [ -z "$version" ] || [ "$version" = "null" ] || [ -z "$sha512" ] || [ "$sha512" = "null" ]; then
            echo "Failed to resolve Antigravity CLI version from manifest" >&2
            exit 1
          fi
          echo "version=${version}-${sha512}" >> "$GITHUB_OUTPUT"

      - name: Cache Antigravity CLI
        id: cache-agy
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/agy
          key: agy-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.agy-version.outputs.version }}

      - name: Install Antigravity CLI
        if: steps.cache-agy.outputs.cache-hit != 'true'
        run: curl -fsSL https://antigravity.google/cli/install.sh | bash

      - name: Verify Antigravity CLI version
        run: agy --version

      - name: Validate plugin structure, links, and statechart compiler
        run: |
          AGY_HOME="$(mktemp -d)"
          trap 'rm -rf "$AGY_HOME"' EXIT
          HOME="$AGY_HOME" agy plugin validate --strict .
          HOME="$AGY_HOME" agy plugin install .
          HOME="$AGY_HOME" agy plugin validate --strict "$AGY_HOME/.gemini/config/plugins/agy-pstack-next"
          HOME="$AGY_HOME" agy plugin list --json > "$AGY_HOME/plugins.json"
          AGY_PLUGINS_JSON="$AGY_HOME/plugins.json" node --input-type=module -e '
            import { accessSync, constants, readdirSync, readFileSync, existsSync } from "node:fs";
            import { dirname, join, resolve } from "node:path";

            const errors = [];
            const fail = (msg) => errors.push(msg);

            for (const legacy of [".antigravity-plugin", "hooks.json", "hooks", "roles", "agents", "automations", "docs", "skills/verify-gen"]) {
              if (existsSync(legacy)) {
                fail(`Legacy path "${legacy}" must not exist`);
              }
            }

            const pluginJson = JSON.parse(readFileSync("plugin.json", "utf8"));
            const expectedSkills = [
              "bro",
              "create-formal-verification-skill",
              "create-verification-skill",
              "crucible",
              "interrogate",
              "maintain-formal-verification-skill",
              "maintain-verification-skill",
              "pstack",
              "statechart",
              "typescript-best-practices",
              "understand",
            ];
            const actualSkills = readdirSync("skills", { withFileTypes: true })
              .filter((d) => d.isDirectory())
              .map((d) => d.name)
              .sort();

            if (JSON.stringify(actualSkills) !== JSON.stringify(expectedSkills)) {
              fail(`Expected skills [${expectedSkills.join(", ")}], found [${actualSkills.join(", ")}]`);
            }

            const statechartBin = join("skills", "statechart", "scripts", "statechart");
            try {
              accessSync(statechartBin, constants.X_OK);
            } catch {
              fail(`${statechartBin} must exist and be executable`);
            }

            const allowedScriptsDir = join("skills", "statechart", "scripts");
            const walkMd = (dir) => {
              const out = [];
              for (const entry of readdirSync(dir, { withFileTypes: true })) {
                const p = join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name === "scripts") {
                    if (p !== allowedScriptsDir) fail(`Unexpected scripts directory: ${p}`);
                    continue;
                  }
                  out.push(...walkMd(p));
                } else if (entry.name.endsWith(".md")) {
                  out.push(p);
                }
              }
              return out;
            };

            const mdFiles = ["README.md", ...walkMd("rules"), ...walkMd("skills")];
            for (const file of mdFiles) {
              const text = readFileSync(file, "utf8");
              for (const m of text.matchAll(/\]\((?!https?:|mailto:|file:|customization:)([^)#]+)(?:#[^)]*)?\)/g)) {
                const target = resolve(dirname(file), m[1]);
                if (!existsSync(target)) {
                  fail(`${file}: broken relative link "${m[1]}"`);
                }
              }
            }

            for (const dir of actualSkills) {
              const skillFile = join("skills", dir, "SKILL.md");
              const content = readFileSync(skillFile, "utf8");
              const fm = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/)?.[1];
              if (!fm) {
                fail(`${skillFile}: missing YAML frontmatter`);
                continue;
              }
              const skillName = fm.match(/^name:\s*(.+)$/m)?.[1]?.trim();
              if (skillName !== dir) fail(`${skillFile}: name "${skillName}" !== "${dir}"`);
              if (!fm.match(/^description:\s*(.+)$/m)?.[1]?.trim()) {
                fail(`${skillFile}: missing description`);
              }
              if (/^(paths|disable-model-invocation):/m.test(fm)) {
                fail(`${skillFile}: unsupported Cursor-only frontmatter key found`);
              }
            }

            const pluginRule = join("rules", "AGENTS.md");
            if (!existsSync(pluginRule)) {
              fail(`${pluginRule} must exist`);
            }
            const legacyPrinciples = join("skills", "pstack", "references", "principles.md");
            if (existsSync(legacyPrinciples)) {
              fail(`${legacyPrinciples} must not exist; consolidated into ${pluginRule}`);
            }

            const swarmContract = join("skills", "pstack", "references", "swarm-contract.md");
            if (!existsSync(swarmContract)) {
              fail(`${swarmContract} must exist`);
            } else {
              const swarmContractText = readFileSync(swarmContract, "utf8");
              if (!swarmContractText.includes("<appDataDir>/builtin/skills/native_swarm/SKILL.md")) {
                fail(`${swarmContract}: must fall back to <appDataDir>/builtin/skills/native_swarm/SKILL.md when built-in swarm is omitted from <skills>`);
              }
              if (!swarmContractText.includes("Embedded & Non-Swarm Contexts")) {
                fail(`${swarmContract}: must document Embedded & Non-Swarm Contexts for Layer 1 portability`);
              }
            }

            const interopRef = join("skills", "pstack", "references", "orchestrator-interop.md");
            if (!existsSync(interopRef)) {
              fail(`${interopRef} must exist`);
            } else {
              if (!readFileSync(join("skills", "pstack", "SKILL.md"), "utf8").includes("references/orchestrator-interop.md")) {
                fail("skills/pstack/SKILL.md: must reference references/orchestrator-interop.md");
              }
              if (!readFileSync(swarmContract, "utf8").includes("(orchestrator-interop.md)")) {
                fail(`${swarmContract}: must reference orchestrator-interop.md`);
              }
            }

            const swarmSkills = [
              "create-formal-verification-skill",
              "create-verification-skill",
              "crucible",
              "interrogate",
              "maintain-formal-verification-skill",
              "maintain-verification-skill",
              "pstack",
              "statechart",
              "typescript-best-practices",
              "understand",
            ];
            for (const dir of swarmSkills) {
              const skillFile = join("skills", dir, "SKILL.md");
              const content = readFileSync(skillFile, "utf8");
              const expectedRef = dir === "pstack" ? "references/swarm-contract.md" : "../pstack/references/swarm-contract.md";
              if (!content.includes(`(${expectedRef})`)) {
                fail(`${skillFile}: must reference ${expectedRef}`);
              }
            }

            const broText = readFileSync(join("skills", "bro", "SKILL.md"), "utf8");
            if (!broText.includes("Never spawn swarm workers, write files, or edit the repository.")) {
              fail("skills/bro/SKILL.md: must preserve zero-side-effect inline rule");
            }

            const driftPattern = /across model families|cross-family|overriding its default single-model rule|Autonomous model|action:\s*"models"|swarm_monitor|swarm_narrator|plan\.json|open_board/i;
            for (const file of ["plugin.json", ...mdFiles]) {
              const text = readFileSync(file, "utf8");
              const hit = text.match(driftPattern);
              if (hit) {
                fail(`${file}: contains built-in swarm override/drift pattern "${hit[0]}"`);
              }
            }

            const installedList = JSON.parse(readFileSync(process.env.AGY_PLUGINS_JSON, "utf8"));
            const installed = installedList.find((p) => p.name === pluginJson.name);
            if (!installed || !installed.enabled) {
              fail(`Installed plugin "${pluginJson.name}" missing or disabled`);
            } else if (JSON.stringify([...(installed.skills ?? [])].sort()) !== JSON.stringify(expectedSkills)) {
              fail(`Loaded skills mismatch: ${JSON.stringify(installed.skills)}`);
            }

            if (errors.length > 0) {
              for (const err of errors) console.error(`ERROR: ${err}`);
              process.exit(1);
            }
            console.log(`Validated ${actualSkills.length} skills and ${mdFiles.length} markdown files.`);
          '

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache TLA+ tools
        id: cache-tla2tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/tla2tools/tla2tools-1.7.4.jar
          key: tla2tools-1.7.4

      - name: Download TLA+ tools
        if: steps.cache-tla2tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/tla2tools"
          curl -fsSL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$HOME/.cache/tla2tools/tla2tools-1.7.4.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $HOME/.cache/tla2tools/tla2tools-1.7.4.jar" | sha256sum -c -

      - name: Test statechart compiler
        working-directory: skills/statechart/scripts
        run: |
          npm install --no-package-lock --no-audit --no-fund
          TLA2TOOLS="$HOME/.cache/tla2tools/tla2tools-1.7.4.jar" npm test
          rm -rf node_modules
